<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Group Project Simulator</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="./assets/css/styles.css">
</head>


<body>
	<!-- <input class="form-control" type="text" value="Readonly input here..." aria-label="readonly input example" readonly> -->
	<div class="top-of-page d-flex align-items-center px-4 py-3">
		<div class="logo">W</div>
		<input class="form-control search-bar mx-auto w-50" placeholder="Search">
	</div>

	<!-- Thin top border line white -->
	<div class="border-top border-white opactiy-50"></div>

	<div class="d-flex page">

		<!-- Side-bar logos -->

		<div class=" side-bar d-flex flex-column mb-3 ms-4 mt-5">
			<div class="speech-bubble p-2">speech</div>
			<div class="people p-2">contacts</div>
			<div class="calender p-2">calender</div>
			<div class="cell-phone p-2">cell phone</div>
		</div>

		<!-- Message Bar -->

		<div class="message-bar p-3">
			<h5>Chat</h5>

			<div class="d-flex gap-5 my-4">
				<div class="top-options">s</div>
				<div class="top-options">d</div>
				<div class="top-options">f</div>
			</div>

			<div class="d-flex gap-5 my-4">
				<h6>Profile</h6>
			</div>

			<div class="d-flex gap-3 my-2">
				<div class="flex-shrink-0">
					<!-- <img src="assets/img/testimg.jpg" alt="profile picture of Audrey"> -->
				</div>
				<div class="profile-text">McHaughen, Audrey (You)</div>
			</div>

			<div class="d-flex gap-5 my-4">
				<h6>Chats</h6>
			</div>

			<div class="d-flex gap-3 my-2">
				<div class="flex-shrink-0">
					<!-- <img src="assets/img/testimg.jpg" alt="profile icom of team-1"> -->
				</div>
				<div class="group-1">Group 1</div>
			</div>

		</div>

		<!-- Main Chat Area -->
		<div class="d-flex page">

			<!-- Team 1 on main page -->
			<div class="d-flex gap-2 mx-3 my-3">
				<div class="flex-shrink-0">
					<!-- <img src="assets/img/..." alt="picture of team profile"> -->
				</div>

				<div class="team-1-main-chat">Team 1</div>
			</div>

			<!-- Main chat area (scorllable) -->
			<div class="chat-area flex-grow-1 d-flex flex-column">
				<div class="messages flex-grow-1 overflow-auto p-4">
					
					<div class="message-row left">
						<div class="message-bubble">Left message</div>
					</div>

						<div class="Collin-name"> Unaveltoo, Collin Ucate</div>
						<div class="d-flex align-items-center">
							<div class="flex-shrink-0">
								<img src="assets/img/testimg.jpg" alt="profile icom of Collin">
							</div>
						<div class="message-bubble">Left message</div>
					</div>

					<div class="message-row right">
						<div class="message-bubble">Right message</div>
					</div>
					<div class="message-row left">
						<div class="message-bubble">Left message</div>
					</div>

					<div class="message-row right">
						<div class="message-bubble">Right message</div>
					</div>



				</div>
			</div>


			<!-- end of div for main chat area -->
		</div>
		<!-- End of page </div> -->
	</div>

	<script src="./assets/js/main.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>

</html>
